<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}"
      xmlns:sec="http://www.w3.org/1999/xhtml"
>
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Title</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <script defer th:src="@{/js/main.js}"></script>
</head>
<body sec:authorize="isAuthenticated()">
<section id="mainSection" layout:fragment="content">
    <section class="demo">
        <div class="accordion" id="accordionExample">
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button" type="button" data-bs-toggle="collapse"
                            data-bs-target="#collapseOne" aria-expanded="true" aria-controls="collapseOne">
                        공지사항
                    </button>
                </h2>
                <div id="collapseOne" class="accordion-collapse collapse show" data-bs-parent="#accordionExample">
                    <div class="accordion-body" th:text="${article.getContent()}">
                    </div>
                </div>
            </div>
        </div>
        <div class="progress-container">
            <div class="progress-box">
                <div class="text-container">
                    <div class="text-box">
                        <p class="text-title">확인량/작업량 (월)</p>
                        <p th:text="${progress.getCount() == 0 ? '0 / 0' : progress.getSignCount() + ' / ' + progress.getCount()}"
                           class="text-workload"></p>
                    </div>
                    <div class="spring"></div>
                    <p th:text="${progress.getCount() == 0 ? '0%' : (progress.getSignCount() * 100 / progress.getCount()) + '%'}"
                       class="text-percent"></p>
                </div>
                <div class="progress-bar">
                    <div class="progress" id="myProgressBar"></div>
                </div>
            </div>

            <div class="progress-box">
                <div class="text-container">
                    <div class="text-box">
                        <p class="text-title">확인량/작업량 (년)</p>
                        <p th:text="${progressOfYear.getCount() == 0 ? '0 / 0' : progressOfYear.getSignCount() + ' / ' + progressOfYear.getCount()}"
                           class="text-workload"></p>
                    </div>
                    <div class="spring"></div>
                    <p th:text="${progressOfYear.getCount() == 0 ? '0%' : (progressOfYear.getSignCount() * 100 / progressOfYear.getCount()) + '%'}"
                       class="text-percentOfYear"></p>
                </div>
                <div class="progress-bar">
                    <div class="progress" id="myProgressBarOfYear"></div>
                </div>
            </div>

            <div class="progress-box">
                <p class="text-title">일 평균 작업량</p>
                <p th:text="${averageSubmitImage}" class="text-workload"></p>
            </div>
        </div>

        <div class="best-worker">
            <div class="title">
                <span>최우수 작업자</span>
            </div>
            <div class="worker-container">
                <div class="worker-text" th:each="worker : ${bestWorker}">
                    <div th:text="${worker.getName()}">
                    </div>
                </div>
            </div>

        </div>
    </section>

    <section>

    </section>
    <section>

    </section>
</section>
</body>
</html>
