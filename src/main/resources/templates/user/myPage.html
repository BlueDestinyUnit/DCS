<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>내 정보</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/user/common2.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/user/myPage.css}">
    <script defer type="text/javascript" th:src="@{/js/user/common.js}"></script>
    <script defer type="text/javascript" th:src="@{/js/user/myPage.js}"></script>
    <script th:src="@{/js/user/modifyButton.js}" defer type="text/javascript"></script>
</head>
<body>
<section id="myPageSection" layout:fragment="content">
    <h1 class="title">내 정보</h1>
    <form novalidate class="dialog" id="infoForm">
        <label class="_obj-label label" rel="myEmailLabel">
            <span class="__text">내 이메일</span>
            <input disabled class="form-control" th:value="${#authentication.getPrincipal().getUserEntity().getEmail()}" name="email">
        </label>
        <label class="_obj-label label" rel="myNameLabel">
            <span class="__text">내 이름</span>
            <input class="form-control" th:value="${#authentication.getPrincipal().getUserEntity().getName()}" name="name">
        </label>
        <label class="_obj-label label" rel="myNicknameLabel">
            <span class="__text">내 닉네임</span>
            <input class="form-control" th:value ="${#authentication.getPrincipal().getUserEntity().getNickname()}" name="nickname">
        </label>
        <label class="_obj-label label" rel="myTelLabel">
            <span class="__text">내 연락처</span>
            <input class="form-control" th:value ="${#authentication.getPrincipal().getUserEntity().getTel()}" name="tel">
        </label>
        <label class="_obj-label label" rel="myAddressLabel">
            <span class="__text">내 주소</span>
            <input class="form-control" th:value ="${#authentication.getPrincipal().getUserEntity().getAddress()}" name="address">
        </label>
        <label class="_obj-label label" rel="myWorkTypeLabel">
            <span class="__text">내 근로형태</span>
            <span class="form-check-label">
            <input id="part" type="radio" name="workType" value="part" th:checked="${#authentication.getPrincipal().getUserEntity().getWorkType() == 'part'}">
            <label for="part">part</label>
        </span>
            <span class="form-check-label">
            <input id="full" type="radio" name="workType" value="full" th:checked="${#authentication.getPrincipal().getUserEntity().getWorkType() == 'full'}">
            <label for="full">full</label>
        </span>
        </label>
        <button class="_obj-button" rel="modifyPasswordButton" type="button">
            <i class="__icon"></i>
            <span class="__text">비밀번호 수정하기</span>
        </button>
        <button class="_obj-button" rel="modifyButton" type="button">
            <i class="__icon"></i>
            <span class="__text">수정하기</span>
        </button>
    </form>
</section>
</body>
</html>
