<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layouts/layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/css/bootstrap-datepicker.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/js/bootstrap-datepicker.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/locales/bootstrap-datepicker.ko.min.js"></script>
    <link rel="stylesheet" type="text/css" th:href="@{/assets/styles/feedbackList.css}">
    <script defer type="text/javascript" th:src="@{/js/user/feedbackList.js}"></script>

</head>
<body>
<section layout:fragment="content">
    <form id="demo">
        <div class="board-container">
            <div class="container mt-5">
                <div class="spring"></div>
                <div class="selectedDate">
                    <input type="hidden" class="date-value" th:value="${date}">
                    <p th:value="${date}" th:text="${#strings.substring(date, 0, 4)} + '년 ' + ${#strings.substring(date, 5, 7)} + '월'"></p>
                </div>
                <div class="form-group">
                    <label class="text" for="datepicker">날짜 선택</label>
                    <div class="input-group">
                        <label class="label">
                            <input type="text" class="form-control datepicker" id="datepicker"
                                   placeholder="YYYY/MM">
                            <button class="blue" rel="dateButton">선택</button>
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <div class="container">
<!--            <input class="hiddenValue" th:value="${selectDate}" type="hidden">-->
            <table id="table" class="table">
                <caption class="a11y-hidden">Table Caption</caption>
                <thead>
                <tr>
                    <th class="fix" scope="col">(日)</th>
                    <th class="fix" scope="col">작업량</th>
                    <th class="fix" scope="col">불용</th>
                </tr>
                </thead>
                <tbody id="tbody">
                <tr class="spacer"></tr> <!-- 간격을 위한 빈 행 -->
                <tr th:each="progress, iterStat : ${progressList}" th:attr="data-index=${iterStat.index}">
                    <td class="first-td" th:text="${iterStat.index + 1} + '일'"></td>
                    <td th:text="${progress.getCount()}"></td>
                    <td th:style="${progress.getSignCount() > 0 ? 'color: red;' : ''}" th:text="${progress.getSignCount() > 0 ? '√' : '-'}"></td>
<!--                    <td th:text="${payment.isInsurance() ? 'O' : 'X'}">보험</td>-->
<!--                    <td th:text="${payment.getWorkDays()}"></td>-->
<!--                    <td th:text="${payment.getPayment() + ' ₩'}" rel="payments"></td>-->
                </tr>
                </tbody>
            </table>
        </div>

    </form>
</section>


</body>
</html>
